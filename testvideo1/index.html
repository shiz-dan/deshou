<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>miklonchiki</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0e0e0e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Mono', monospace;
    }
    .stage {
      display: flex;
      align-items: center;
      gap: 28px;
    }
    .nav-btn {
      width: 52px;
      height: 52px;
      background: transparent;
      border: 2px solid #333;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
      border-radius: 6px;
      transition: border-color .2s, color .2s, transform .1s;
      flex-shrink: 0;
    }
    .nav-btn:hover  { border-color: #e8ff47; color: #e8ff47; }
    .nav-btn:active { transform: scale(.92); }
    .nav-btn:disabled { opacity: .2; cursor: default; }
    .frame {
      width: min(65vw, 560px);
      height: min(65vw, 560px);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    #anim {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 4px;
    }
    #replay-btn {
      display: none;
      position: absolute;
      bottom: -52px;
      left: 50%;
      transform: translateX(-50%);
      background: transparent;
      border: 2px solid #333;
      color: #fff;
      font-size: 22px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      transition: border-color .2s, color .2s, transform .3s;
      align-items: center;
      justify-content: center;
    }
    #replay-btn:hover {
      border-color: #e8ff47;
      color: #e8ff47;
      transform: translateX(-50%) rotate(-40deg);
    }
    #replay-btn.visible { display: flex; }
  </style>
</head>
<body>

<div class="stage">
  <button class="nav-btn" id="prev">&#8249;</button>
  <div class="frame">
    <video id="anim" src="testvideo1.mp4" muted playsinline preload="auto"></video>
    <button id="replay-btn" title="Replay">&#8635;</button>
  </div>
  <button class="nav-btn" id="next">&#8250;</button>
</div>

<script>
  const anim      = document.getElementById('anim');
  const replayBtn = document.getElementById('replay-btn');
  const prev      = document.getElementById('prev');
  const next      = document.getElementById('next');

  // Navigation
  prev.disabled = true;
  next.addEventListener('click', () => window.location.href = '/deshou/');
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') window.location.href = '/deshou/';
  });

  // Wait for video to load its first frame, then pause on it
  anim.addEventListener('loadeddata', () => {
    anim.currentTime = 0;
    // After 1 second, play
    setTimeout(() => {
      anim.play();
    }, 1000);
  });

  // When video ends: show replay button
  anim.addEventListener('ended', () => {
    replayBtn.classList.add('visible');
  });

  // Replay
  replayBtn.addEventListener('click', () => {
    replayBtn.classList.remove('visible');
    anim.currentTime = 0;
    anim.play();
  });
</script>

</body>
</html>

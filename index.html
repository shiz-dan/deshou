<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gallery</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e0e;
      --surface: #161616;
      --accent: #e8ff47;
      --text: #f0f0f0;
      --muted: #555;
      --btn-size: 56px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Subtle grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .stage {
      display: flex;
      align-items: center;
      gap: 32px;
      position: relative;
      z-index: 1;
    }

    .nav-btn {
      width: var(--btn-size);
      height: var(--btn-size);
      background: transparent;
      border: 2px solid var(--muted);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 22px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 4px;
      transition: border-color .2s, color .2s, background .2s, transform .1s;
      flex-shrink: 0;
      user-select: none;
    }

    .nav-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(232,255,71,.06);
    }

    .nav-btn:active {
      transform: scale(.93);
    }

    .frame {
      width: min(60vw, 520px);
      height: min(60vw, 520px);
      background: var(--surface);
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .frame img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: none;
      animation: fadeIn .3s ease;
    }

    .frame img.active { display: block; }

    .placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      color: var(--muted);
    }

    .placeholder svg { opacity: .4; }

    .placeholder p {
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(.97); }
      to   { opacity: 1; transform: scale(1); }
    }

    .counter {
      position: absolute;
      bottom: 12px;
      right: 14px;
      font-size: 10px;
      letter-spacing: .12em;
      color: var(--muted);
    }

    /* Upload button below */
    .upload-wrap {
      margin-top: 28px;
      position: relative;
      z-index: 1;
    }

    .upload-label {
      display: inline-block;
      padding: 10px 24px;
      border: 1px solid var(--muted);
      border-radius: 4px;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
      transition: border-color .2s, color .2s;
    }

    .upload-label:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    #file-input { display: none; }

    .hint {
      margin-top: 14px;
      font-size: 10px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #333;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="stage">
    <button class="nav-btn" id="prev" aria-label="Previous">&#8249;</button>

    <div class="frame" id="frame">
      <div class="placeholder" id="placeholder">
        <!-- simple image icon -->
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        <p>No images loaded</p>
      </div>
      <span class="counter" id="counter"></span>
    </div>

    <button class="nav-btn" id="next" aria-label="Next">&#8250;</button>
  </div>

  <div class="upload-wrap">
    <label class="upload-label" for="file-input">+ Add images</label>
    <input type="file" id="file-input" accept="image/*" multiple />
  </div>

  <p class="hint">Images stay local — nothing is uploaded to any server</p>

<script>
  const images = [
    "your-image.png",  // keep your actual filename here
  ];

  let i = 0;
  const img     = document.getElementById('img');
  const counter = document.getElementById('counter');
  const prev    = document.getElementById('prev');
  const next    = document.getElementById('next');

  function show(index) {
    img.src = images[index];
    img.alt = images[index];
    counter.textContent = images.length > 1 ? `${index + 1} / ${images.length}` : '';
    prev.disabled = false;
    next.disabled = false;
  }

  prev.addEventListener('click', () => {
    if (i > 0) show(--i);
    else window.location.href = '/deshou/testvideo1/';
  });

  next.addEventListener('click', () => {
    if (i < images.length - 1) show(++i);
    else window.location.href = '/deshou/0/';
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') {
      if (i > 0) show(--i);
      else window.location.href = '/deshou/testvideo1/';
    }
    if (e.key === 'ArrowRight') {
      if (i < images.length - 1) show(++i);
      else window.location.href = '/deshou/0/';
    }
  });

  show(0);
</script>
</body>
</html>

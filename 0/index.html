<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>miklonchiki</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0e0e0e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Mono', monospace;
    }

    .stage {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav-btn {
      width: 52px;
      height: 52px;
      background: transparent;
      border: 2px solid #333;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
      border-radius: 6px;
      transition: border-color .2s, color .2s, transform .1s;
      flex-shrink: 0;
    }
    .nav-btn:hover  { border-color: #e8ff47; color: #e8ff47; }
    .nav-btn:active { transform: scale(.92); }
    .nav-btn:disabled { opacity: .2; cursor: default; }

    .frame {
      width: min(65vw, 560px);
      height: min(65vw, 560px);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .frame img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 4px;
      animation: pop .25s ease;
    }

    @keyframes pop {
      from { opacity: 0; transform: scale(.96); }
      to   { opacity: 1; transform: scale(1); }
    }

    .counter {
      position: absolute;
      bottom: -28px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: #444;
      letter-spacing: .1em;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<div class="stage">
  <button class="nav-btn" id="prev">&#8249;</button>
  <div class="frame">
    <img id="img" src="" alt=""/>
    <span class="counter" id="counter"></span>
  </div>
  <button class="nav-btn" id="next">&#8250;</button>
</div>

<script>
  // ======================================
  //  ADD YOUR IMAGE FILENAMES HERE
  // ======================================
  const images = [
    "testimage1.png",
  ];
  // ======================================

  let i = 0;
  const img     = document.getElementById('img');
  const counter = document.getElementById('counter');
  const prev    = document.getElementById('prev');
  const next    = document.getElementById('next');

  function show(index) {
    img.src = images[index];
    img.alt = images[index];
    counter.textContent = images.length > 1 ? `${index + 1} / ${images.length}` : '';
    next.disabled = index === images.length - 1;
    prev.disabled = false;  // always allow going back
  }
  
  prev.addEventListener('click', () => {
    if (i > 0) show(--i);
    else window.location.href = '/deshou/';
  });
  
  next.addEventListener('click', () => {
    if (i < images.length - 1) show(++i);
    // else window.location.href = '/deshou/1/';  ← uncomment when /1/ exists
  });
  
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') {
      if (i > 0) show(--i);
      else window.location.href = '/deshou/';
    }
    if (e.key === 'ArrowRight' && i < images.length - 1) show(++i);
  });
  
  show(0);
</script>
</body>
</html>
